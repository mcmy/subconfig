name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Resolve release metadata
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease, e.g. v1.0.0 or v1.1.0-rc.1' >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Release checks
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.value }}
    permissions:
      contents: read

  docker:
    name: Publish Linux amd64 and arm64 image
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.value }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=subconfig-multiarch
          cache-to: type=gha,scope=subconfig-multiarch,mode=max

  release:
    name: Publish binary release
    needs: [version, verify, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: subconfig-binaries
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.value }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          IMAGE: ${{ needs.version.outputs.image }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          cat > release-notes.md <<EOF
          64-bit binaries for Linux, Windows and macOS, plus a multi-platform Linux Docker image.

          - Linux: \`subconfig_${VERSION}_linux_amd64.tar.gz\`, \`subconfig_${VERSION}_linux_arm64.tar.gz\`
          - Windows x64: \`subconfig_${VERSION}_windows_amd64.zip\`
          - macOS: \`subconfig_${VERSION}_darwin_amd64.tar.gz\`, \`subconfig_${VERSION}_darwin_arm64.tar.gz\`
          - Docker platforms: \`linux/amd64\`, \`linux/arm64\` (selected automatically)
          - Integrity check: \`sha256sum --check SHA256SUMS\`
          - Docker image: \`${IMAGE}:${VERSION}\`
          - Immutable image: \`${IMAGE}@${DIGEST}\`

          The archive includes the README, examples, Docker Compose configuration and license.
          EOF
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --title "subconfig $VERSION" --notes-file release-notes.md --generate-notes)
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--prerelease)
            else
              flags+=(--latest)
            fi
            gh release create "$VERSION" "${flags[@]}"
          fi
          gh release upload "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          gh release edit "$VERSION" --draft=false
