name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the binary and image
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Test and package 64-bit binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT:-dev-${GITHUB_SHA::7}}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Package all release binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/package.py "$VERSION"

      - name: Upload binary packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subconfig-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  binaries:
    name: Run binary on ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-24.04
          - target: linux/arm64
            runner: ubuntu-24.04-arm
          - target: windows/amd64
            runner: windows-2025
          - target: darwin/amd64
            runner: macos-15-intel
          - target: darwin/arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binary packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: subconfig-binaries
          path: dist

      - name: Verify archives and run native binary
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          version="${VERSION_INPUT:-dev-${GITHUB_SHA::7}}"
          python_cmd=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            python_cmd=python
          fi
          "$python_cmd" scripts/verify-release.py "$version" "$EXPECTED_TARGET"

  docker:
    name: Test Docker on linux/${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT:-dev-${GITHUB_SHA::7}}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build native Linux image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: subconfig:ci
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=subconfig-linux-${{ matrix.arch }}
          cache-to: type=gha,scope=subconfig-linux-${{ matrix.arch }},mode=max

      - name: Verify Docker CLI, HTTP service and Compose
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SUBCONFIG_IMAGE: subconfig:ci
          SUBCONFIG_SECRET: ci-test-secret
        run: |
          test "$(docker run --rm subconfig:ci --version)" = "subconfig $VERSION"
          test "$(docker image inspect subconfig:ci --format '{{.Os}}/{{.Architecture}}')" = linux/${{ matrix.arch }}
          test "$(docker run --rm --entrypoint id subconfig:ci -u)" = 10001
          docker run --rm -i subconfig:ci convert -c - -t sing-box < examples/clash.yaml > /tmp/subconfig-docker.json
          python3 -c 'import json; d=json.load(open("/tmp/subconfig-docker.json")); assert any(o.get("type") == "trojan" for o in d["outbounds"])'
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 60
          curl --fail --silent http://127.0.0.1:25500/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:25500/version)" = 401
          test "$(curl --fail --silent -H "Authorization: Bearer $SUBCONFIG_SECRET" http://127.0.0.1:25500/version)" = "subconfig $VERSION"
          curl --fail --silent --get http://127.0.0.1:25500/sub \
            -H "Authorization: Bearer $SUBCONFIG_SECRET" \
            --data-urlencode 'url=trojan://example-password@example.com:443#example' \
            --data-urlencode 't=sing-box' > /tmp/subconfig-http.json
          python3 -c 'import json; d=json.load(open("/tmp/subconfig-http.json")); assert any(o.get("type") == "trojan" for o in d["outbounds"])'

      - name: Stop test service
        if: always()
        env:
          SUBCONFIG_IMAGE: subconfig:ci
          SUBCONFIG_SECRET: ci-test-secret
        run: |
          docker compose logs --no-color
          docker compose down
